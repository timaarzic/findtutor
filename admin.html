<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — FindTutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Mulish:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">Find<span>Tutor</span></a>
      <div style="font-size:13px;font-weight:600;color:var(--text-muted);flex:1;padding-left:20px">Админ-панель</div>
      <div class="header__btns">
        <a href="index.html" class="btn btn--outline" data-tip="Вернуться на сайт">На сайт</a>
        <button class="btn btn--primary" onclick="logout()" data-tip="Выйти из аккаунта">Выйти</button>
      </div>
    </div>
  </header>

  <section style="padding:40px 0 72px">
    <div class="container">
      <h1 style="font-family:'Unbounded',sans-serif;font-size:24px;font-weight:700;margin-bottom:8px">Управление репетиторами</h1>
      <p style="color:var(--text-muted);margin-bottom:28px;font-size:14px">Проверяй документы и подтверждай анкеты</p>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:32px" id="statsBlock"></div>

      <div style="display:flex;gap:10px;margin-bottom:18px">
        <button class="btn btn--primary" id="fAll"     onclick="setFilter('all')">Все</button>
        <button class="btn btn--outline" id="fPending" onclick="setFilter('pending')">На проверке</button>
        <button class="btn btn--outline" id="fDone"    onclick="setFilter('done')">Проверены</button>
      </div>

      <div id="adminList"></div>
      <div id="adminEmpty" style="display:none;text-align:center;padding:56px 0">
        <div style="font-size:40px;margin-bottom:12px">🎓</div>
        <div style="font-size:16px;font-weight:600;margin-bottom:8px">Репетиторов нет</div>
        <p style="color:var(--text-muted)">Как только кто-то зарегистрируется — появятся здесь</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="logo">Find<span>Tutor</span></div>
      <div class="footer__copy">© 2026 FindTutor</div>
      <div class="footer__author">Разработано студентом — <span>Timur Arzyev</span> · 1-25.ИСИП.ОД.9</div>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script>
    requireAdmin()
    var currentFilter = 'all'

    function setFilter(f) {
      currentFilter = f
      document.getElementById('fAll').className     = 'btn ' + (f==='all'     ? 'btn--primary' : 'btn--outline')
      document.getElementById('fPending').className = 'btn ' + (f==='pending' ? 'btn--primary' : 'btn--outline')
      document.getElementById('fDone').className    = 'btn ' + (f==='done'    ? 'btn--primary' : 'btn--outline')
      render()
    }

    function render() {
      var all  = getTutors()
      var list = all.slice()
      if (currentFilter === 'pending') list = list.filter(function(t){ return !t.verified })
      if (currentFilter === 'done')    list = list.filter(function(t){ return t.verified })

      var pend = all.filter(function(t){ return !t.verified }).length
      var ver  = all.filter(function(t){ return t.verified }).length
      document.getElementById('statsBlock').innerHTML =
        statCard('Всего репетиторов', all.length, '#e8f0fe', '#1a3a8f') +
        statCard('На проверке', pend, '#fff3bf', '#b06a00') +
        statCard('Верифицировано', ver, '#d3f9d8', '#1e6e30')

      var el  = document.getElementById('adminList')
      var emp = document.getElementById('adminEmpty')
      if (list.length === 0) { el.innerHTML=''; emp.style.display='block'; return }
      emp.style.display = 'none'

      el.innerHTML = list.map(function(t) {
        var c   = avatarColor(t.firstName)
        var ini = initials(t.firstName, t.lastName)
        var revs = []
        var badge = t.verified
          ? '<span class="badge-verified" style="font-size:12px;padding:3px 10px">✓ Верифицирован</span>'
          : '<span class="badge-pending"  style="font-size:12px;padding:3px 10px">⏳ На проверке</span>'
        return '<div class="tutor-row" style="margin-bottom:12px;cursor:default">' +
          '<div class="tutor-row__avatar" style="background:'+c.bg+';color:'+c.color+'">'+ini+'</div>' +
          '<div class="tutor-row__info">' +
            '<div class="tutor-row__name">'+escHtml(t.firstName)+' '+escHtml(t.lastName)+' '+badge+'</div>' +
            '<div class="tutor-row__subject">'+escHtml(t.subject||'—')+(t.city?' · '+escHtml(t.city):'')+'</div>' +
            '<div style="font-size:12px;color:var(--text-muted);margin-top:3px">📧 '+escHtml(t.email)+(t.phone?' · 📞 '+escHtml(t.phone):'')+' · '+revs.length+' отзывов</div>' +
          '</div>' +
          '<div class="tutor-row__right">' +
            '<div class="tutor-row__price">'+(t.price?escHtml(t.price)+' ₽/час':'—')+'</div>' +
            '<div style="display:flex;flex-direction:column;gap:7px;margin-top:8px">' +
              (!t.verified
                ? '<button class="btn btn--primary" style="font-size:12px;padding:6px 14px" onclick="verify('+t.id+',true)" data-tip="Подтвердить верификацию">✓ Подтвердить</button>'
                : '<button class="btn btn--outline" style="font-size:12px;padding:6px 14px;border-color:#c92a2a;color:#c92a2a" onclick="verify('+t.id+',false)" data-tip="Отозвать верификацию">Отозвать</button>') +
              '<a href="tutor.html?id='+t.id+'" class="btn btn--outline" style="font-size:12px;padding:6px 14px;text-align:center" data-tip="Открыть анкету">Анкета →</a>' +
              (t.docFile
                ? '<a href="'+t.docFile+'" target="_blank" class="btn btn--outline" style="font-size:12px;padding:6px 14px;text-align:center" data-tip="Открыть документ">📄 Документ</a>'
                : '<div style="font-size:11px;color:var(--text-muted);text-align:center;padding:4px 0">Документ не загружен</div>') +
              '<button class="btn btn--outline" style="font-size:12px;padding:6px 14px;border-color:#c92a2a;color:#c92a2a" onclick="deleteTutor('+t.id+')" data-tip="Удалить навсегда">Удалить</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      }).join('')
    }

    function statCard(label, val, bg, color) {
      return '<div style="background:'+bg+';border-radius:12px;padding:18px" class="admin-stat-card">' +
        '<div class="admin-stat-label" style="color:'+color+'">'+label+'</div>' +
        '<div class="admin-stat-value" style="color:'+color+'">'+val+'</div>' +
        '</div>'
    }

    function verify(id, status) {
      var users = getUsers()
      var idx   = users.findIndex(function(u){ return u.id===id })
      if (idx !== -1) { users[idx].verified = status; saveUser(users[idx]) }
      render()
    }

    function deleteTutor(id) {
      if (!confirm('Удалить анкету? Это нельзя отменить.')) return
      _deleteUser(id)
      render()
    }

    document.addEventListener('ft:ready', function() { render() })
  </script>
</body>
</html>
